name: Daytona benchmark launcher

on:
  pull_request:
    paths:
      - "tools/daytona_agentic_bench.py"
      - "tools/test_daytona_agentic_bench.py"
      - "docs/DAYTONA_AGENTIC_BENCHMARKS.md"
      - ".github/workflows/daytona-bench.yml"
  push:
    branches:
      - main
    paths:
      - "tools/daytona_agentic_bench.py"
      - "tools/test_daytona_agentic_bench.py"
      - ".github/workflows/daytona-bench.yml"

jobs:
  launcher-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Command-generation tests
        run: python3 tools/test_daytona_agentic_bench.py
      - name: Compile launcher
        run: python3 -m py_compile tools/daytona_agentic_bench.py
