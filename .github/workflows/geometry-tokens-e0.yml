name: Geometry Tokens E0

on:
  pull_request:
    paths:
      - "demos/geometry-tokens-e0/**"
      - ".github/workflows/geometry-tokens-e0.yml"
  push:
    branches:
      - main
    paths:
      - "demos/geometry-tokens-e0/**"
      - ".github/workflows/geometry-tokens-e0.yml"

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: |
          python -m py_compile \
            demos/geometry-tokens-e0/geometry_tokens.py \
            demos/geometry-tokens-e0/generate_blender.py
      - name: Test Geometry Tokens parser
        env:
          PYTHONPATH: demos/geometry-tokens-e0
        run: |
          python -m unittest discover \
            -s demos/geometry-tokens-e0/tests \
            -p 'test_*.py' \
            -v
